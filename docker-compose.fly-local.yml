services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: thandev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend:
    build: ./backend
    env_file:
      - .env.fly.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: [ "./entrypoint.sh" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  thandev-brain:
    build: ./services/thandev-brain
    env_file:
      - .env.fly.local
    volumes:
      # Mount app code for live development (allows code changes without rebuild)
      - ./services/thandev-brain/app:/app/app
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      backend:
        condition: service_started
    ports:
      - "8001:8001"
    command: [ "./start_brain.sh" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/docs" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: zap
    ports:
      - "8090:8090"
      - "8080:8080" # Expose proxy port so runner can access URLs through ZAP
    command: [ "zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8090", "-config", "api.disablekey=true", "-config", "api.addrs.addr.name=.*", "-config", "api.addrs.addr.regex=true", "-config", "api.addrs.addr.enabled=true" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8090/JSON/core/view/version/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - default

  thandev-runner:
    build: ./services/thandev-runner
    env_file:
      - .env.fly.local
    environment:
      # Runner paths must be inside the runner container filesystem (NOT backend paths).
      TOOLS_BASE_DIR: /app
      DATA_DIR: /app/data
      JOBS_DIR: /app/data/jobs
      WORDLISTS_DIR: /opt/thandev/wordlists
      ZAP_API_URL: http://zap:8090
    volumes:
      # Mount shared wordlists from repo root so ffuf can run with full wordlists
      - ./wordlists:/opt/thandev/wordlists:ro
      # Mount app code for live development (allows code changes without rebuild)
      - ./services/thandev-runner/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      zap:
        condition: service_healthy
    command: [ "./start_runner.sh" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - default

volumes:
  postgres_data:
  qdrant_data:
