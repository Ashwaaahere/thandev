services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: thandev
      POSTGRES_PASSWORD: thandev
      POSTGRES_DB: thandev
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ./backend
    depends_on: [db, redis]
    environment:
      DATABASE_URL: postgresql+psycopg://thandev:thandev@db:5432/thandev
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    command: bash -lc "alembic upgrade head || true; uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    depends_on: [db, redis]
    environment:
      DATABASE_URL: postgresql+psycopg://thandev:thandev@db:5432/thandev
      REDIS_URL: redis://redis:6379/0
    command: bash -lc "celery -A app.tasks.celery_app worker -l info"

  frontend:
    build: ./frontend
    depends_on: [api]
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000

volumes:
  dbdata:
