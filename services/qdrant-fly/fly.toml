# Fly.io configuration for Qdrant vector database
app = "thandev-qdrant"
primary_region = "iad"

[build]
  image = "qdrant/qdrant:v1.7.4"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[mounts]]
  source = "qdrant_data"
  destination = "/qdrant/storage"

[env]
  QDRANT__SERVICE__HTTP_PORT = "6333"
  QDRANT__SERVICE__HOST = "0.0.0.0"

# PRIVATE service - accessed via .internal DNS only
# Using [[services]] for private networking with .internal DNS
[[services]]
  protocol = "tcp"
  internal_port = 6333
  processes = ["app"]
  
  [[services.ports]]
    handlers = ["http"]
    port = 6333

[processes]
  app = "/qdrant/qdrant"
