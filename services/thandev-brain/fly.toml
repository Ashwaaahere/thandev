# Fly.io configuration for thandev-brain
app = "thandev-brain"
primary_region = "iad"

[build]

[env]
  PORT = "8001"

# PRIVATE service - accessed via .internal DNS only
# Using [[services]] for private networking with .internal DNS
[[services]]
  protocol = "tcp"
  internal_port = 8001
  processes = ["app"]
  
  [[services.ports]]
    handlers = ["http"]
    port = 8001
  
  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
    protocol = "http"

[processes]
  app = "sh -lc \"uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8001}\""


[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048
  disk_size_gb = 15

