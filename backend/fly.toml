# Fly.io configuration for thandev backend
app = "thandev-backend"
primary_region = "iad"

[build]

[deploy]
  # Run migrations once per deploy via release_command
  # Fix alembic_version column first, then run migrations
  # This ensures migrations run on the same database as the app, before containers start
  release_command = "python fix_alembic_version_column.py && alembic upgrade head"

[env]
  PORT = "8000"
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[statics]]
  guest_path = "/app/static"
  url_prefix = "/static/"
