# Fly.io configuration for thandev backend
app = "thandev-backend"
primary_region = "iad"

[build]

[deploy]
  # Migrations are handled by entrypoint.sh (runs before uvicorn starts)
  # No release_command needed - entrypoint.sh ensures DB is ready and migrations are applied

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[[statics]]
  guest_path = "/app/static"
  url_prefix = "/static/"
