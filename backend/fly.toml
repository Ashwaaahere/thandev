# Fly.io configuration for thandev backend
app = "thandev-backend"
primary_region = "iad"

[build]

[deploy]
  # Run migrations once per deploy via release_command
  # This ensures migrations run on the same database as the app, before containers start
  release_command = "alembic upgrade head"

[env]
  PORT = "8000"
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[[statics]]
  guest_path = "/app/static"
  url_prefix = "/static/"
