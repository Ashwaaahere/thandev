# Fly.io configuration for thandev backend
app = "thandev-backend"
primary_region = "iad"

[deploy]
  release_command = "alembic upgrade head"

[env]
  PORT = "8000"
  ENVIRONMENT = "production"
  WEB_CONCURRENCY = "1"

# Public HTTP service
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

  [http_service.machine]
    # Longer request timeout for large payload processing (ZAP findings)
    # Default is 60s, increasing to 180s for 500+ finding ingestion
    [http_service.machine.guest]
      # Settings inherited from [[vm]]

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/healthz"

# Internal service for .internal DNS access
[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]
  
  [[services.ports]]
    handlers = ["http"]
    port = 8000

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = "/app/static"
  url_prefix = "/static/"
