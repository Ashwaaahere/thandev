# Fly.io configuration for thandev backend
app = "thandev-backend"
primary_region = "iad"

[build]

[deploy]
  # Run migrations once per deploy via release_command
  # This ensures migrations run on the same database as the app, before containers start
  # Migrations run in a separate release container that exits after completion
  # Runtime containers (entrypoint.sh) do NOT run migrations - they only start uvicorn
  release_command = "alembic upgrade head"

[env]
  PORT = "8000"
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

# Add private networking to allow communication with brain service
# This enables .internal DNS resolution for private service communication
[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]
  
  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[statics]]
  guest_path = "/app/static"
  url_prefix = "/static/"
