# Fly.io configuration for thandev scheduler
app = "thandev-scheduler"
primary_region = "iad"

[build]

[env]
  PORT = "8001"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# This is a background service, not a web service
[processes]
  app = "python scheduler.py"
