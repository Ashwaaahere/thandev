name: CI

on:
  push:
  pull_request:

jobs:
    frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Detect package manager
      - name: Detect package manager
        id: pm
        run: |
          if [ -f frontend/pnpm-lock.yaml ]; then
            echo "name=pnpm" >> $GITHUB_OUTPUT
          elif [ -f frontend/yarn.lock ]; then
            echo "name=yarn" >> $GITHUB_OUTPUT
          elif [ -f frontend/package-lock.json ]; then
            echo "name=npm" >> $GITHUB_OUTPUT
          else
            echo "No lockfile found. Defaulting to npm (install)."
            echo "name=npm" >> $GITHUB_OUTPUT
          fi

      # Set up Node and cache for the detected PM
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ steps.pm.outputs.name == 'npm' && 'npm' || (steps.pm.outputs.name == 'yarn' && 'yarn' || 'pnpm') }}
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/yarn.lock
            frontend/pnpm-lock.yaml

      # Install package manager if pnpm
      - name: Enable corepack (yarn/pnpm)
        run: corepack enable

      - name: Install deps
        working-directory: frontend
        run: |
          if [ "${{ steps.pm.outputs.name }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile || pnpm install
          elif [ "${{ steps.pm.outputs.name }}" = "yarn" ]; then
            yarn install --frozen-lockfile || yarn install
          else
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
          fi

      - name: Lint (if present)
        working-directory: frontend
        run: |
          if npm run | grep -q "lint"; then
            ( [ "${{ steps.pm.outputs.name }}" = "yarn" ] && yarn lint ) || \
            ( [ "${{ steps.pm.outputs.name }}" = "pnpm" ] && pnpm lint ) || \
            npm run lint
          else
            echo "No lint script; skipping."
          fi

      - name: Build (if present)
        working-directory: frontend
        env:
          # Prevent OOM in Next.js builds on CI
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          if npm run | grep -q "build"; then
            ( [ "${{ steps.pm.outputs.name }}" = "yarn" ] && yarn build ) || \
            ( [ "${{ steps.pm.outputs.name }}" = "pnpm" ] && pnpm build ) || \
            npm run build
          else
            echo "No build script; skipping."
          fi

      - name: Test (if present)
        working-directory: frontend
        run: |
          if npm run | grep -q "test"; then
            ( [ "${{ steps.pm.outputs.name }}" = "yarn" ] && yarn test --ci --watchAll=false ) || \
            ( [ "${{ steps.pm.outputs.name }}" = "pnpm" ] && pnpm test -- --ci --watchAll=false ) || \
            npm test -- --ci --watchAll=false
          else
            echo "No test script; skipping."
          fi

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps (if requirements.txt exists)
        run: |
          if [ -f requirements.txt ]; then
            pip install -U pip
            pip install -r requirements.txt
          else
            echo "No requirements.txt; skipping."
          fi

      - name: Lint (flake8, if present)
        run: |
          if python -c "import importlib.util; import sys; sys.exit(0 if importlib.util.find_spec('flake8') else 1)"; then
            flake8 .
          else
            echo "flake8 not installed; skipping."
          fi

      - name: Tests (pytest, if present)
        run: |
          if python -c "import importlib.util; import sys; sys.exit(0 if importlib.util.find_spec('pytest') else 1)"; then
            pytest -q
          else
            echo "pytest not installed; skipping."
          fi
