name: Deploy to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'services/thandev-brain/**'
      - 'services/thandev-runner/**'
      - '.github/workflows/deploy.yml'

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      brain: ${{ steps.changes.outputs.brain }}
      runner: ${{ steps.changes.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
            brain:
              - 'services/thandev-brain/**'
            runner:
              - 'services/thandev-runner/**'

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || contains(github.event.head_commit.message, '[deploy backend]') || contains(github.event.head_commit.message, '[deploy all]') || contains(github.event.head_commit.message, 'deploy') || contains(github.event.head_commit.message, 'Deploy')
    steps:
      - uses: actions/checkout@v4
      
      - uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy Backend
        run: flyctl deploy --config backend/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: backend

  deploy-brain:
    name: Deploy Brain Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.brain == 'true' || contains(github.event.head_commit.message, '[deploy brain]') || contains(github.event.head_commit.message, '[deploy all]') || contains(github.event.head_commit.message, 'deploy') || contains(github.event.head_commit.message, 'Deploy')
    steps:
      - uses: actions/checkout@v4
      
      - uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy Brain Service
        run: flyctl deploy --config services/thandev-brain/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: services/thandev-brain

  deploy-runner:
    name: Deploy Runner Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.runner == 'true' || contains(github.event.head_commit.message, '[deploy runner]') || contains(github.event.head_commit.message, '[deploy all]') || contains(github.event.head_commit.message, 'deploy') || contains(github.event.head_commit.message, 'Deploy')
    steps:
      - uses: actions/checkout@v4
      
      - uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy Runner Service
        run: flyctl deploy --config services/thandev-runner/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: services/thandev-runner

