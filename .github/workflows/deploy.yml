# Fly.io deploy disabled here — deploy from CLI instead (see backend/scripts/fly-deploy.sh)
name: Deploy to Fly.io

on:
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      brain: ${{ steps.changes.outputs.brain }}
      runner: ${{ steps.changes.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
            brain:
              - 'services/thandev-brain/**'
            runner:
              - 'services/thandev-runner/**'

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy Backend
        run: flyctl deploy --remote-only --config fly.toml --app thandev-backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: backend

  deploy-brain:
    name: Deploy Brain Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.brain == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy Brain Service
        run: flyctl deploy --remote-only --config fly.toml --app thandev-brain
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: services/thandev-brain

  deploy-runner:
    name: Deploy Runner Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.runner == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy Runner Service
        run: flyctl deploy --remote-only --config fly.toml --app thandev-runner
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: services/thandev-runner

