<!DOCTYPE html>
<html>
<head>
    <title>Favicon to PNG</title>
</head>
<body>
    <h1>Favicon Image</h1>
    <p>The favicon is already an image (SVG format). Here it is:</p>
    <img src="frontend/public/favicon.svg" alt="Favicon" style="width: 512px; height: 512px;">
    <p>To convert to PNG, you can:</p>
    <ol>
        <li>Open this HTML file in a browser</li>
        <li>Right-click the image and "Save image as..."</li>
        <li>Or use an online converter like <a href="https://cloudconvert.com/svg-to-png">CloudConvert</a></li>
    </ol>
</body>
</html>
